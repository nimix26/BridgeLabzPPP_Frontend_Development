<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fluid Grid Layout - Task 1</title>
  <style>
    :root{
        --gap:16px;--pad:18px;--bg:#fafafa;--card:#dfeffb
    }
    *{
        box-sizing:border-box
    }
    body{
        margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:#111
    }
    .container{
        max-width:1100px;margin:32px auto;padding:var(--pad)
    }

    
    .grid{
        display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap)
    }
    .box{
        background:var(--card);padding:22px;border-radius:8px;text-align:center;min-width:180px
    }
    .box h3{
        margin:0 0 8px;font-size:1rem
    }
    .box p{
        margin:0;font-size:0.95rem
    }

    
    @media (max-width:720px){.grid{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:420px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="container">
    <div class="grid">
      <div class="box">
        <h3>Box 1</h3>
        <p>Content centered and responsive.</p>
      </div>
      <div class="box">
        <h3>Box 2</h3>
        <p>Content centered and responsive.</p>
      </div>
      <div class="box">
        <h3>Box 3</h3>
        <p>Content centered and responsive.</p>
      </div>
    </div>
  </div>
</body>
</html>
