<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-fit Grid Gallery</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f1f1f1; padding: 1rem; }
        .photo-gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .gallery-item { margin: 0; border: 1px solid #ccc; background: white; box-shadow: 0 2px 2px rgba(0,0,0,0.1); overflow: hidden; }
        .gallery-item > div { width: 100%; height: 150px; background: #e0e0e0; display: flex; align-items: center; justify-content: center; color: #888; font-style: italic; transition: transform 0.5s ease; }
        .gallery-item:hover > div { transform: scale(1.1); }
        figcaption { padding: 0.75rem; text-align: center; font-size: 0.9rem; color: #555; }
    </style>
</head>
<body>
    <div class="photo-gallery">
        <figure class="gallery-item"> <div></div> <figcaption>Mountain View</figcaption> </figure>
        <figure class="gallery-item"> <div>

[Image of a city skyline at night]
</div> <figcaption>City Lights</figcaption> </figure>
        <figure class="gallery-item"> <div></div> <figcaption>Forest Path</figcaption> </figure>
        <figure class="gallery-item"> <div></div> <figcaption>Ocean Beach</figcaption> </figure>
        <figure class="gallery-item"> <div></div> <figcaption>Desert Dune</figcaption> </figure>
        <figure class="gallery-item"> <div></div> <figcaption>Abstract Art</figcaption> </figure>
    </div>
</body>
</html>
