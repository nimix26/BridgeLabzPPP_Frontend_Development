<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q5 - Image Gallery Modal</title>
  <style>
    body { font-family: Arial; padding:20px; max-width:900px; margin:auto; }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .grid img { width:100%; height:150px; object-fit:cover; cursor:pointer; border-radius:6px; border:1px solid #ddd; }
    /* modal */
    .overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:50; }
    .modal { background:#fff; padding:12px; border-radius:6px; max-width:80%; max-height:80%; overflow:auto; }
    .modal img { width:100%; height:auto; display:block; }
  </style>
</head>
<body>
  <h2>Image Gallery (Click to open modal)</h2>

  <div class="grid" id="gallery">
    <!-- Use placeholder images -->
    <img src="https://picsum.photos/seed/1/600/400" alt="1">
    <img src="https://picsum.photos/seed/2/600/400" alt="2">
    <img src="https://picsum.photos/seed/3/600/400" alt="3">
    <img src="https://picsum.photos/seed/4/600/400" alt="4">
    <img src="https://picsum.photos/seed/5/600/400" alt="5">
    <img src="https://picsum.photos/seed/6/600/400" alt="6">
  </div>

  <script>
    // Open modal when an image is clicked. Clicking outside closes the modal.
    const gallery = document.getElementById('gallery');

    gallery.addEventListener('click', (e) => {
      const img = e.target.closest('img');
      if (!img) return;
      openModal(img.src);
    });

    function openModal(src) {
      const overlay = document.createElement('div');
      overlay.className = 'overlay';

      // clicking on overlay closes modal
      overlay.addEventListener('click', () => overlay.remove());

      const modal = document.createElement('div');
      modal.className = 'modal';

      // stop propagation so clicks inside modal don't close it
      modal.addEventListener('click', (ev) => ev.stopPropagation());

      const big = document.createElement('img');
      big.src = src;

      modal.appendChild(big);
      overlay.appendChild(modal);
      document.body.appendChild(overlay);
    }
  </script>
</body>
</html>
