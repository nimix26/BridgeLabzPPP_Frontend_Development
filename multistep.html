<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q3 - Multi-Step Form</title>
  <style>
    body { font-family: Arial, sans-serif; padding:20px; max-width:500px; margin:auto; }
    .step { display:none; }
    .active { display:block; }
    input { width:100%; padding:8px; margin:8px 0; }
    .btns { display:flex; gap:8px; }
    .error { color:#b30000; font-size:13px; }
    .summary { background:#f3f3f3; padding:12px; border-radius:6px; }
  </style>
</head>
<body>
  <h2>Multi-Step Form</h2>

  <div id="step1" class="step active">
    <h3>Step 1: Name</h3>
    <input id="name" placeholder="Enter name" />
    <div id="err-name" class="error"></div>
    <div class="btns"><button id="next1">Next</button></div>
  </div>

  <div id="step2" class="step">
    <h3>Step 2: Email</h3>
    <input id="email" placeholder="Enter email" />
    <div id="err-email" class="error"></div>
    <div class="btns"><button id="back2">Back</button><button id="next2">Next</button></div>
  </div>

  <div id="step3" class="step">
    <h3>Step 3: Password</h3>
    <input id="password" type="password" placeholder="Enter password" />
    <div id="err-pass" class="error"></div>
    <div class="btns"><button id="back3">Back</button><button id="finish">Finish</button></div>
  </div>

  <div id="summary" class="step">
    <h3>Summary</h3>
    <div class="summary" id="summaryContent"></div>
    <div style="margin-top:10px;"><button id="startOver">Start Over</button></div>
  </div>

  <script>
    // Simple step logic with validation
    const steps = ['step1','step2','step3','summary'];
    function show(id) {
      steps.forEach(s => document.getElementById(s).classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');

    document.getElementById('next1').addEventListener('click', () => {
      const v = nameInput.value.trim();
      if (!v) {
        document.getElementById('err-name').textContent = 'Name is required.';
      } else {
        document.getElementById('err-name').textContent = '';
        show('step2');
      }
    });

    document.getElementById('back2').addEventListener('click', () => show('step1'));

    document.getElementById('next2').addEventListener('click', () => {
      const v = emailInput.value.trim();
      if (!v || !v.includes('@')) {
        document.getElementById('err-email').textContent = 'Please enter a valid email with @.';
      } else {
        document.getElementById('err-email').textContent = '';
        show('step3');
      }
    });

    document.getElementById('back3').addEventListener('click', () => show('step2'));

    document.getElementById('finish').addEventListener('click', () => {
      const p = passInput.value;
      if (!p || p.length < 6) {
        document.getElementById('err-pass').textContent = 'Password must be at least 6 characters.';
      } else {
        document.getElementById('err-pass').textContent = '';
        // show summary
        const html = `<strong>Name:</strong> ${escapeHtml(nameInput.value)}<br>
                      <strong>Email:</strong> ${escapeHtml(emailInput.value)}<br>
                      <strong>Password:</strong> ${'*'.repeat(p.length)}`;
        document.getElementById('summaryContent').innerHTML = html;
        show('summary');
      }
    });

    document.getElementById('startOver').addEventListener('click', () => {
      nameInput.value = '';
      emailInput.value = '';
      passInput.value = '';
      show('step1');
    });

    // Live clearing of errors when corrected
    nameInput.addEventListener('input', () => {
      if (nameInput.value.trim()) document.getElementById('err-name').textContent = '';
    });
    emailInput.addEventListener('input', () => {
      if (emailInput.value.includes('@')) document.getElementById('err-email').textContent = '';
    });
    passInput.addEventListener('input', () => {
      if (passInput.value.length >= 6) document.getElementById('err-pass').textContent = '';
    });

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
  </script>
</body>
</html>
