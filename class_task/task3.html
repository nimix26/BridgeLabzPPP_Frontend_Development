<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Media Query Example - Task 3</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;text-align:center;padding:20px;background-color:lightyellow;}

    h2{margin-bottom:20px;}

    @media (max-width:768px){
      body{background-color:lightgreen;}
    }

    
    @media (max-width:480px){
      body{background-color:lightblue;}
    }
  </style>
</head>
<body>
  <h2>Task 3: Media Query Example</h2>
  <p>Resize the browser window to see the background color change:</p>
  <ul style="list-style:none;margin-top:20px;">
    <li><strong>Desktop:</strong> Light Yellow</li>
    <li><strong>Tablet:</strong> Light Green (width ≤ 768px)</li>
    <li><strong>Mobile:</strong> Light Blue (width ≤ 480px)</li>
  </ul>
</body>
</html>
