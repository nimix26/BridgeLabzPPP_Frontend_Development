<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .flip-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f0f2f5; }
        .flip-card { background-color: transparent; width: 300px; height: 400px; perspective: 1000px; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; box-shadow: 0 4px 10px rgba(0,0,0,0.2); border-radius: 10px; }
        .flip-card:hover .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 10px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; box-sizing: border-box; }
        .flip-card-front { background-color: #ffffff; color: black; }
        .flip-card-front > div { width: 100px; height: 100px; background: #ddd; border-radius: 50%; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; font-style: italic; color: #777; }
        .flip-card-back { background-color: #007bff; color: white; transform: rotateY(180deg); }
    </style>
</head>
<body>
    <div class="flip-wrapper">
        <div class="flip-card">
            <div class="flip-card-inner">
                <div class="flip-card-front"> <div></div> <h2>Product Title</h2> </div>
                <div class="flip-card-back"> <h2>Description</h2> <p>Here is some detailed information about the product, revealed on the back of the card.</p> </div>
            </div>
        </div>
    </div>
</body>
</html>
