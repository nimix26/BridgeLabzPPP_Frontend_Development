<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1. Borders and Padding</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            text-align: center;
        }
        .container {
            display: flex; /* Use Flexbox */
            justify-content: space-around; /* Align boxes horizontally */
            flex-wrap: wrap;
            gap: 20px;
        }
        .box {
            width: 200px;
            height: 150px;
            background-color: #e0e0e0;
            text-align: center;
            font-size: 1.1em;
            
            /* Transition for hover effect */
            transition: border-color 0.3s ease;
        }
        
        /* --- Border Styles --- */
        .solid {
            border: 5px solid #333;
        }
        .dashed {
            border: 5px dashed #d9534f;
        }
        .double {
            border: 8px double #5cb85c;
        }
        .groove {
            border: 10px groove #f0ad4e;
        }

        /* --- Padding Examples --- */
        .padding-small {
            padding: 10px;
            border: 2px solid #5bc0de;
        }
        .padding-large {
            padding: 40px;
            border: 2px solid #5bc0de;
        }
        
        /* --- Border Radius --- */
        .rounded-small {
            border: 4px solid #337ab7;
            border-radius: 15px; /* Rounded corners */
        }
        .rounded-large {
            border: 4px solid #337ab7;
            border-radius: 50px; /* More rounded */
        }

        /* --- Hover Effect --- */
        .box:hover {
            border-color: #ff6347; /* Change border color on hover */
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Borders, Padding, and Radius</h1>
    
    <h2>Border Styles</h2>
    <div class="container">
        <div class="box solid">Solid Border</div>
        <div class="box dashed">Dashed Border</div>
        <div class="box double">Double Border</div>
        <div class="box groove">Groove Border</div>
    </div>

    <h2>Padding</h2>
    <div class="container">
        <div class="box padding-small">Small Padding (10px)</div>
        <div class="box padding-large">Large Padding (40px)</div>
    </div>

    <h2>Border Radius</h2>
    <div class="container">
        <div class="box rounded-small">Rounded (15px)</div>
        <div class="box rounded-large">Rounded (50px)</div>
    </div>
</body>
</html>
