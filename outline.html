<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9. Outline and Focus</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .form-container {
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            width: 400px;
        }
        h2 {
            text-align: center;
            color: #333;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px; /* Uniform spacing */
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 8px; /* Neat appearance */
            box-sizing: border-box; /* Consistent sizing */
            
            /* Default non-focused outline */
            outline: 3px solid transparent; /* Prepare for outline */
            
            transition: all 0.2s ease-in-out;
        }

        /* --- :focus Selector for Outline Styling --- */
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            border-color: #4a90e2; /* Change border on focus */
            
            /* Change outline color on focus */
            outline-color: #cce1f9;
            
            /* Use outline-offset to create space */
            outline-offset: 4px;
            
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.1); /* Subtle shadow */
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        
        /* Styling a different element with a different outline */
        .button {
            display: block;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #4a90e2;
            color: white;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .button:hover {
            background-color: #357abd;
        }
        
        /* Button focus style (using outline) */
        .button:focus {
            outline: 3px dashed #e74c3c; /* Dashed outline */
            outline-offset: 3px;
        }

    </style>
</head>
<body>
    <div class="form-container">
        <h2>Contact Us</h2>
        <form>
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Click me to see focus">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="With outline-offset">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" placeholder="Textarea gets focus too"></textarea>
            </div>
            <button type="submit" class="button">Submit (Dashed Focus)</button>
        </form>
    </div>
</body>
</html>
