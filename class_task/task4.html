<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Responsive Typography - Task 4</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Arial,Helvetica,sans-serif;text-align:center;padding:40px;background:#f9f9f9;color:#222}

    h1{
      font-size:clamp(1.5rem, 4vw, 3rem);
      margin-bottom:20px;
      color:#333;
    }

    p{
      font-size:clamp(1rem, 2.5vw, 1.5rem);
      max-width:700px;
      margin:auto;
      line-height:1.6;
    }
  </style>
</head>
<body>
  <h1>Responsive Typography Example</h1>
  <p>
    This heading and paragraph adjust their font sizes automatically depending on the screen width using the <code>clamp()</code> function. Resize your browser to see the text grow or shrink smoothly.
  </p>
</body>
</html>
