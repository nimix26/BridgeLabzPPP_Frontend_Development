<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Pricing</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
        .pricing-container { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 2rem; }
        .pricing-card { background-color: white; border: 1px solid #ddd; border-radius: 10px; padding: 2rem; width: 300px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; animation: fadeIn 0.5s ease-out forwards; opacity: 0; }
        .pricing-card:nth-child(2) { animation-delay: 0.2s; }
        .pricing-card:nth-child(3) { animation-delay: 0.4s; }
        .pricing-card.featured { transform: scale(1.1); background-color: #007bff; color: white; box-shadow: 0 8px 20px rgba(0,123,255,0.3); }
        .pricing-card.featured .price { color: #fff; }
        .pricing-card.featured .btn { background-color: white; color: #007bff; }
        .pricing-card:hover { transform: translateY(-10px); box-shadow: 0 8px 12px rgba(0,0,0,0.15); }
        .pricing-card.featured:hover { transform: scale(1.1) translateY(-10px); }
        .price { font-size: 2rem; font-weight: bold; color: #007bff; margin: 1rem 0; }
        ul { list-style: none; padding: 0; margin: 1.5rem 0; }
        li { margin-bottom: 0.5rem; }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; transition: background-color 0.3s ease; }
        .btn:hover { background-color: #0056b3; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 750px) {
            .pricing-container { flex-direction: column; align-items: center; }
            .pricing-card.featured { transform: scale(1); }
        }
    </style>
</head>
<body>
    <section class="pricing-container">
        <div class="pricing-card">
            <h2>Basic</h2> <p class="price">$10/mo</p> <ul> <li>10 GB Storage</li> <li>1 User</li> <li>Email Support</li> </ul> <a href="#" class="btn">Sign Up</a>
        </div>
        <div class="pricing-card featured">
            <h2>Pro</h2> <p class="price">$25/mo</p> <ul> <li>50 GB Storage</li> <li>5 Users</li> <li>Phone & Email Support</li> </ul> <a href="#" class="btn">Sign Up</a>
        </div>
        <div class="pricing-card">
            <h2>Enterprise</h2> <p class="price">$50/mo</p> <ul> <li>100 GB Storage</li> <li>Unlimited Users</li> <li>24/7 Support</li> </ul> <a href="#" class="btn">Sign Up</a>
        </div>
    </section>
</body>
</html>
