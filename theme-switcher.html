<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Q4 - Theme Switcher</title>
  <style>
    :root { --bg:#fff; --text:#111; }
    [data-theme="dark"] { --bg:#111; --text:#eee; }
    [data-theme="blue"] { --bg:#e8f1ff; --text:#023e8a; }
    body { background:var(--bg); color:var(--text); font-family:Arial; padding:20px; transition:background .2s; }
    button { padding:8px 12px; margin-right:8px; }
    .info { margin-top:12px; color:inherit; }
  </style>
</head>
<body>
  <h2>Theme Switcher</h2>
  <div>
    <button data-theme="light">Light</button>
    <button data-theme="dark">Dark</button>
    <button data-theme="blue">Blue</button>
  </div>
  <div class="info">Current theme saved in <code>data-theme</code> on the &lt;body&gt; element.</div>

  <script>
    // Use setAttribute to switch theme and store it as data-theme
    const buttons = document.querySelectorAll('button[data-theme]');
    const body = document.body;

    // Load from attribute if present (or default to light)
    if (!body.getAttribute('data-theme')) body.setAttribute('data-theme', 'light');

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.getAttribute('data-theme');
        body.setAttribute('data-theme', t); // required: use setAttribute
      });
    });
  </script>
</body>
</html>
