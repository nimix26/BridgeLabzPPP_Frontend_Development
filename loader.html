<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Loader</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; }
        .loader-container { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #2c3e50; gap: 0.5rem; }
        .circle { width: 15px; height: 15px; background-color: #3498db; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
        .circle:nth-child(1) { animation-delay: -0.32s; }
        .circle:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: translateY(0); } 40% { transform: translateY(-20px); } }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>
</body>
</html>
